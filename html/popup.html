<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WebWidgetizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="popup">
    <header class="popup-header">
        <h2>🌐 WebWidgetizer</h2>
        <p>Open sites in dedicated widget tabs</p>
    </header>

    <section class="actions-grid">
        <button id="openButton" class="btn-primary">🪟 Open</button>
        <button id="saveSiteButton" class="btn-secondary">💾 Save This Site</button>
        <button id="optionsButton" class="btn-icon">⚙️</button>
    </section>

    <div class="divider"></div>

    <section class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Search links or tags..." class="standard-input">
    </section>

    <main class="links-section">
        <h3>Saved Widgets</h3>
        <ul id="linksList" class="styled-list custom-scroll"></ul>
    </main>

    <div class="divider"></div>

    <footer class="popup-footer">
        <a href="https://msehic.com/" target="_blank">M.Šehić</a>
        <span>&bull;</span>
        <a href="#" id="shareLink">Share</a>
        <span>&bull;</span>
        <a href="https://github.com/sponsors/MuxBH28/" target="_blank">Support Dev</a>
    </footer>

    <script src="../js/popup.js"></script>
</body>

</html>
